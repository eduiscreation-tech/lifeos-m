<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>LIFEOS M</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=033">
</head>
<body>
  <div class="app-shell">
    <aside class="side-nav">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div><strong>LIFEOS M</strong><small>Mobile Life Operating System</small></div>
      </div>
      <nav id="desktopNav"></nav>
      <button class="ghost sync-button" id="syncBtnDesktop">↻ 동기화</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">오늘</h1>
          <div class="sub" id="todayLabel"></div>
        </div>
        <div class="sync-state" id="syncState">로컬</div>
      </header>

      <section id="view"></section>

      <section class="quick-box">
        <label for="quickInput">인박스 빠른 입력</label>
        <div class="quick-row">
          <input id="quickInput" autocomplete="off" placeholder="그냥 적어. 예: 세탁기 필터 주문">
          <button id="quickAdd">입력</button>
        </div>
        <div class="quick-help">제목만 입력해도 됨 · 필요할 때만 직장: / #태그 / 숫자 명령 사용</div>
      </section>
    </main>

    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <dialog id="taskDialog">
    <form method="dialog" class="dialog-card">
      <h3 id="dialogTitle">할 일</h3>
      <input type="hidden" id="editId">
      <label>제목<input id="editTitle"></label>
      <label class="area-field">영역<div id="editAreaChoices" class="area-choices" aria-label="영역 선택"></div><input id="editArea" type="hidden"></label>
      <label>예정일<input id="editDue" type="datetime-local"></label>
      <label class="check-label"><input id="editImportant" type="checkbox"> 오늘 핵심 후보로 표시</label>
      <details class="advanced-fields" id="advancedDetails">
        <summary>상세 설정</summary>
        <div class="advanced-body">
          <div class="form-grid">
            <label>상태<select id="editStatus"></select></label>
            <label>구분<select id="editScope"><option>개인</option><option>직장</option></select></label>
            <label>유형<select id="editType"><option>할일</option><option>루틴</option><option>구매</option><option>일정</option></select></label>
            <label>목록<input id="editList" placeholder="일반 / 다이소 / 대전집"></label>
            <label id="routineSlotWrap">루틴 구간<select id="editRoutineSlot"><option>기상</option><option>직장</option><option>점심</option><option>퇴근 후</option><option>저녁</option><option>취침전</option></select></label>
          </div>
          <label>태그<input id="editTags" placeholder="#건강 #학교 #투자"></label>
          <label>기다리는 사람 / 위임자<input id="editDelegate"></label>
          <label>메모<textarea id="editNote"></textarea></label>
        </div>
      </details>
      <div class="dialog-actions">
        <button value="cancel" class="ghost">닫기</button>
        <button value="default" id="saveEdit">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card">
      <h3>동기화 설정</h3>
      <p class="muted">Apps Script 웹앱 URL을 한 번 입력하면 이 기기에 저장돼.</p>
      <label>Apps Script 웹앱 URL<input id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec"></label>
      <label>API 토큰<input id="apiTokenInput" type="password" placeholder="Code.gs의 API_TOKEN 값"></label>
      <div class="dialog-actions">
        <button value="cancel" class="ghost">닫기</button>
        <button value="default" id="saveSettings">저장 후 동기화</button>
      </div>
    </form>
  </dialog>

  <script src="config.js?v=033"></script>
  <script src="seed-data.js?v=033"></script>
  <script src="app.js?v=033"></script>
</body>
</html>
